# Pubblica automaticamente il sito su Firebase a ogni modifica del ramo main
# (per esempio quando sostituisci un'immagine in public/img da GitHub).
# Serve il segreto FIREBASE_SERVICE_ACCOUNT: vedi README.md, "Pubblicazione automatica".
name: Pubblica su Firebase

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firebase.json"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: degrado-milano
